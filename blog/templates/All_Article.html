{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="{% static 'styles/first.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body class="p-3 mb-2 bg-white text-black">
    <center>
        <h1 class="text-white bg-dark">Усі блоги нашого сайту</h1>
    </center>

    <div class='row'>
        {% for article in articles %}
        <div class="col-12 mb-3">
            <h2>
                {{ article.name }}
                {% for category in article.category.all %}
                    {{ category.name }}
                {% endfor %}

                {% for tag in article.tags.all %}
                    {{ tag.name }}
                {% endfor %}
            </h2>
            <a href="{% url 'articles_detail_page' article.pk %}"><button class="btn btn-primary">Детальніше</button></a>
            <p></p>
        </div>
        {% endfor %}
    </div>

    <p></p>

    <center>
        <p></p>
        <a href="{% url 'articles_create_page' %}"><button class="btn btn-success"><h2>Створити новий блог</h2></button></a>
    </center>

    <center>
        <a href="{% url 'main_page' %}" class="btn btn-secondary">Назад</a>
    </center>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
