{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="{% static 'styles/first.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>
    <center>
        <h1>Коментарі</h1>
    </center>
    <p></p>

    <div id="comments-container">
            {% for comment in comments %}
            <div class="row comment mb-2" id="comment-{{ comment.id }}">
                <div class="col-sm-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">{{ article.name }}</h5>
                            <h4>{{ comment.user }}</h4>
                            <p class="card-text">{{ comment.text }}</p>
                            <a href="{% url 'comment_update_page' comment.id %}">
                                <button class="btn btn-warning">Редагувати</button>
                            </a>
                            <a href="{% url 'comment_delete_page' comment.id %}">
                                <button class="btn btn-danger">Видалити</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
    </div>

    <p></p>
    <form id="comment-form" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Надіслати</button>
    </form>
    <p></p>
    <center>
        <a href="{% url 'articles_page' %}"><button class="btn btn-secondary">Назад</button></a>
    </center>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
    $(document).ready(function() {
        $('#comment-form').submit(function(e) {
            e.preventDefault(); // Prevent page reload

            $.ajax({
                type: 'POST',
                url: '', // current page
                data: $(this).serialize(),
                success: function(response) {
                    $('#comments-container').append(`
                        <div class="row comment mb-2" id="comment-${response.id}">
                            <div class="col-sm-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">${response.article_name}</h5>
                                        <h4>${response.user}</h4>
                                        <p class="card-text">${response.text}</p>
                                        <a href="/comment_to_article/comment_update/${response.id}/">
                                            <button class="btn btn-warning">Редагувати</button>
                                        </a>
                                        <a href="/comment_to_article/comment_delete/${response.id}/">
                                            <button class="btn btn-danger">Видалити</button>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                    $('#comment-form')[0].reset(); // Clear form
                },
                error: function() {
                    alert('Помилка! Спробуйте ще раз.');
                }
            });
        });
    });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
