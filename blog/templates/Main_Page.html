{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="{% static 'styles/first.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>

    <center>
        <h1>Всі Блог</h1>
        <h2>Блоги для всіх та на різні теми.</h2>
    </center>

    <h2>Форма для фільтрації</h2>
    <p></p>
    <form method="GET">
        {% csrf_token %}
  
        <div id = 'form-container'>
            {{ form.as_p }}
            <p></p>
            <button type="submit", class="btn btn-primary">Шукати</button> 
        </div>
    </form>
    <p></p>

    <center>
        <h2>Список блогів</h2>
    </center>

    <center>
        <a href="/articles/" class="btn btn-info">Більше блогів</a>
    </center>

    <div class="position-fixed top-0 end-0 p-3 bg-light shadow" style="z-index: 1050;">
        <div class="d-flex align-items-center gap-3">
            <h2 class="mb-0">Вхід та реєстрація</h2>
            {% if user.is_authenticated %}
            <a href="/logout/" class="btn btn-warning">Вихід</a>
            <a href="/profile/" class="btn btn-info">Профіль</a>
            {% else %}
            <a href="/login/" class="btn btn-info">Вхід</a>
            {% endif %}
            <a href="/registration/" class="btn btn-secondary">Реєстрація</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
